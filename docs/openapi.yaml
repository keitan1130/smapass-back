# Current implemented API. Keep in sync with Go public types and docs/api.md.
openapi: 3.2.1
info:
  title: smapass-back API
  version: 0.1.0
  description: Read-only scaffold. Ingestion, authentication, certificate issuance,
    grading, JCS and chain verification are not implemented. Demo evidence has invalid
    signatures and no anchor.
servers:
- url: http://localhost:8080
security: []
paths:
  /health:
    get:
      operationId: health
      summary: Process liveness
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: ready
      summary: Database readiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503': &id001
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/certificates:
    get:
      operationId: listCertificates
      summary: Read certificates by known public numbers
      parameters:
      - name: ids
        in: query
        required: true
        description: 1 to 50 comma-separated numbers. Duplicates are removed; unknown
          numbers are omitted; results are sorted by number.
        schema:
          type: string
        example: 01ABC-DEFGH
      responses:
        '200':
          description: Public certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates'
        '400': &id002
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id003
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405': &id004
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id005
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id006
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id001
  /api/certificates/{number}:
    get:
      operationId: getCertificate
      summary: Read an issued public snapshot and current listing
      parameters:
      - &id007
        name: number
        in: path
        required: true
        description: Crockford Base32 10 characters; case, spaces, hyphens and O/I/L
          aliases are normalized.
        schema:
          type: string
      responses:
        '200':
          description: Public certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400': *id002
        '404': *id003
        '405': *id004
        '429': *id005
        '500': *id006
        '503': *id001
  /api/certificates/{number}/records:
    get:
      operationId: getCertificateRecords
      summary: Read frozen certificate evidence, ordered by sequence
      parameters:
      - *id007
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 1000000
      responses:
        '200':
          description: Evidence page; these records do not imply verification success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Records'
        '400': *id002
        '404': *id003
        '405': *id004
        '429': *id005
        '500': *id006
        '503': *id001
components:
  schemas:
    Certificate:
      type: object
      required:
      - number
      - status
      - successor_number
      - issued_at
      - is_demo
      - snapshot
      - listing
      properties:
        number:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{10}$
          examples:
          - 01ABCDEFGH
        status:
          type: string
          enum:
          - valid
          - revoked
          - superseded
        successor_number:
          type:
          - string
          - 'null'
        issued_at:
          type: string
          format: date-time
        is_demo:
          type: boolean
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        listing:
          anyOf:
          - $ref: '#/components/schemas/Listing'
          - type: 'null'
    Snapshot:
      type: object
      required:
      - schema_version
      - device
      - grade
      - recording
      - battery
      - os_history
      - status_history
      - maintenance_records
      properties:
        schema_version:
          type: integer
          format: int32
        device:
          $ref: '#/components/schemas/DeviceSpec'
        grade:
          $ref: '#/components/schemas/Grade'
        recording:
          $ref: '#/components/schemas/Recording'
        battery:
          $ref: '#/components/schemas/Battery'
        os_history:
          type: array
          items:
            $ref: '#/components/schemas/OSVersion'
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/StatusRecord'
        maintenance_records:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceRecord'
    DeviceSpec:
      type: object
      required:
      - manufacturer
      - model
      - device_name
      - soc
      - cpu_cores
      - ram_bytes
      - storage_bytes
      - screen_size_inch
      - screen_density_dpi
      - os_version
      - sdk_int
      - collected_at
      properties:
        manufacturer:
          type: string
        model:
          type: string
        device_name:
          type:
          - string
          - 'null'
        soc:
          type:
          - string
          - 'null'
        cpu_cores:
          type:
          - integer
          - 'null'
          format: int32
        ram_bytes:
          type:
          - integer
          - 'null'
          format: int64
        storage_bytes:
          type:
          - integer
          - 'null'
          format: int64
        screen_size_inch:
          type:
          - number
          - 'null'
          format: double
        screen_density_dpi:
          type:
          - integer
          - 'null'
          format: int32
        os_version:
          type:
          - string
          - 'null'
        sdk_int:
          type:
          - integer
          - 'null'
          format: int32
        collected_at:
          type: string
          format: date-time
    Grade:
      type: object
      required:
      - value
      - label
      - explanation
      - algorithm_version
      - items
      properties:
        value:
          type:
          - string
          - 'null'
        label:
          type: string
        explanation:
          type: string
        algorithm_version:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/GradeItem'
    GradeItem:
      type: object
      required:
      - name
      - value
      - explanation
      properties:
        name:
          type: string
        value:
          type:
          - string
          - 'null'
        explanation:
          type: string
    Recording:
      type: object
      required:
      - started_at
      - ended_at
      - count
      - gap_threshold_seconds
      - gaps
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        count:
          type: integer
          format: int32
        gap_threshold_seconds:
          type:
          - integer
          - 'null'
          format: int64
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/RecordingGap'
    RecordingGap:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    Battery:
      type: object
      required:
      - latest_full_charge_mah
      - initial_full_charge_mah
      - change_percent
      - cycle_count
      - trend
      properties:
        latest_full_charge_mah:
          type:
          - integer
          - 'null'
          format: int32
        initial_full_charge_mah:
          type:
          - integer
          - 'null'
          format: int32
        change_percent:
          type:
          - number
          - 'null'
          format: double
        cycle_count:
          type:
          - integer
          - 'null'
          format: int32
        trend:
          type: array
          items:
            $ref: '#/components/schemas/BatteryPoint'
    BatteryPoint:
      type: object
      required:
      - collected_at
      - full_charge_mah
      - temperature_c
      properties:
        collected_at:
          type: string
          format: date-time
        full_charge_mah:
          type:
          - integer
          - 'null'
          format: int32
        temperature_c:
          type:
          - number
          - 'null'
          format: double
    OSVersion:
      type: object
      required:
      - collected_at
      - os_version
      - sdk_int
      properties:
        collected_at:
          type: string
          format: date-time
        os_version:
          type: string
        sdk_int:
          type: integer
          format: int32
    StatusRecord:
      type: object
      required:
      - sequence
      - collected_at
      - os_version
      - sdk_int
      - battery_temp_c
      - battery_cycle_count
      - battery_charge_mah
      - battery_full_charge_mah
      - boot_count
      - had_abnormal_exit
      - thermal_headroom
      properties:
        sequence:
          type: integer
          format: int64
        collected_at:
          type: string
          format: date-time
        os_version:
          type: string
        sdk_int:
          type: integer
          format: int32
        battery_temp_c:
          type:
          - number
          - 'null'
          format: double
        battery_cycle_count:
          type:
          - integer
          - 'null'
          format: int32
        battery_charge_mah:
          type:
          - integer
          - 'null'
          format: int32
        battery_full_charge_mah:
          type:
          - integer
          - 'null'
          format: int32
        boot_count:
          type:
          - integer
          - 'null'
          format: int32
        had_abnormal_exit:
          type:
          - boolean
          - 'null'
        thermal_headroom:
          type:
          - number
          - 'null'
          format: double
    MaintenanceRecord:
      type: object
      required:
      - provider_name
      - provider_type
      - recorded_at
      - description
      properties:
        provider_name:
          type: string
        provider_type:
          type: string
        recorded_at:
          type: string
          format: date-time
        description:
          type: string
    Listing:
      type: object
      required:
      - marketplace
      - item_id
      - imei_suffix
      - registered_at
      properties:
        marketplace:
          type: string
        item_id:
          type: string
        imei_suffix:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{4}$
        registered_at:
          type: string
          format: date-time
    VerificationRecord:
      type: object
      required:
      - sequence
      - type
      - collected_at
      - canonical_payload
      - payload_hash
      - previous_hash
      - signature_base64
      - public_key
      - signature_algorithm
      - canonicalization
      - anchor_state
      - chain
      - transaction_hash
      - merkle_root
      - leaf_index
      - merkle_proof
      properties:
        sequence:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - spec
          - status
          - inspection
        collected_at:
          type: string
          format: date-time
        canonical_payload:
          type: string
        payload_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        previous_hash:
          type:
          - string
          - 'null'
        signature_base64:
          type: string
        public_key:
          type: string
        signature_algorithm:
          type: string
        canonicalization:
          type: string
        anchor_state:
          type: string
          enum:
          - unanchored
          - pending
          - confirmed
          - failed
        chain:
          type:
          - string
          - 'null'
        transaction_hash:
          type:
          - string
          - 'null'
        merkle_root:
          type:
          - string
          - 'null'
        leaf_index:
          type:
          - integer
          - 'null'
          format: int32
        merkle_proof:
          type: array
          items:
            $ref: '#/components/schemas/ProofStep'
    ProofStep:
      type: object
      required:
      - side
      - hash
      properties:
        side:
          type: string
          enum:
          - left
          - right
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    Certificates:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Certificate'
    Records:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerificationRecord'
        total:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
