name: smapass-back

x-app: &app
  image: smapass-back:local
  build:
    context: .
    dockerfile: docker/app.dockerfile
  environment:
    DB_DSN: ${DB_DSN:?copy .env.example to .env}
    HTTP_ADDR: :8080
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ATTESTATION_PACKAGE_NAME: ${ATTESTATION_PACKAGE_NAME:-}
    ATTESTATION_SIGNING_SHA256: ${ATTESTATION_SIGNING_SHA256:-}
    ATTESTATION_REQUIRE_IMEI: ${ATTESTATION_REQUIRE_IMEI:-false}

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Tapyrus anchor worker. Not started by default: docker compose --profile anchor up -d anchor
  anchor:
    image: smapass-back:local
    entrypoint: ["anchor"]
    profiles: ["anchor"]
    # Run as the host user so a 600 client certificate stays readable without loosening it.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_DSN: ${DB_DSN:?copy .env.example to .env}
      TAPYRUS_API_URL: ${TAPYRUS_API_URL:-}
      TAPYRUS_ACCESS_TOKEN: ${TAPYRUS_ACCESS_TOKEN:-}
      TAPYRUS_CLIENT_CERT_FILE: /run/secrets/tapyrus-client.pem
      ANCHOR_CHAIN: ${ANCHOR_CHAIN:-tapyrus}
      ANCHOR_BATCH_INTERVAL: ${ANCHOR_BATCH_INTERVAL:-10m}
      ANCHOR_POLL_INTERVAL: ${ANCHOR_POLL_INTERVAL:-30s}
      ANCHOR_MAX_LEAVES: ${ANCHOR_MAX_LEAVES:-1000}
    volumes:
      # Create it first (see .env.example); a missing file stops startup instead of creating a directory.
      - type: bind
        source: ./secrets/tapyrus-client.pem
        target: /run/secrets/tapyrus-client.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    <<: *app
    entrypoint: ["migrate"]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - dbdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dbdata18:
