name: smapass-back-demo

x-app: &app
  image: smapass-back:demo
  build:
    context: .
    dockerfile: docker/app.dockerfile
  environment:
    DB_DSN: ${DB_DSN:?set DB_DSN in .env.demo}
    HTTP_ADDR: :8080
    CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
    # ホストからの接続元となるIPv4ゲートウェイだけを信頼する。
    TRUSTED_PROXY_CIDRS: ${DEMO_GATEWAY:?set Docker IPv4 gateway}/32
    ATTESTATION_PACKAGE_NAME: ${ATTESTATION_PACKAGE_NAME:?set applicationId}
    ATTESTATION_SIGNING_SHA256: ${ATTESTATION_SIGNING_SHA256:?set APK certificate SHA256}
    ATTESTATION_REQUIRE_IMEI: ${ATTESTATION_REQUIRE_IMEI:-false}

services:
  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/ready']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Tapyrus の設定・証明書を用意し、--profile anchor を指定した場合だけ起動する。
  anchor:
    extends:
      file: compose.yaml
      service: anchor
    image: smapass-back:demo
    build:
      context: .
      dockerfile: docker/app.dockerfile

  migrate:
    <<: *app
    entrypoint: [migrate]
    command: [up]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - dbdata18:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    ipam:
      config:
        - subnet: ${DEMO_SUBNET:?set Docker IPv4 subnet}
          gateway: ${DEMO_GATEWAY:?set Docker IPv4 gateway}

volumes:
  dbdata18:
